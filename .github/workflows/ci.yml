name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      - name: flake check
        run: nix flake check --all-systems

      - name: format check
        run: |
          nix develop -c bash -c \
            'find . -name "*.nix" -not -path "./.git/*" | xargs nixfmt --check'
